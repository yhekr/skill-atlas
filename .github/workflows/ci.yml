name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Check C# formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build CLI, core, web and tests
        run: dotnet build -c Release --no-restore
      - name: Run unit and integration tests
        run: dotnet test -c Release --no-build --logger "trx" --results-directory artifacts/test-results
      - name: Test CI watcher scripts
        shell: pwsh
        run: ./scripts/Test-CI.ps1
      - name: Package CLI tool
        run: dotnet pack src/SkillAtlas.Cli -c Release --no-build -o artifacts/packages
      - name: Publish web application
        run: dotnet publish src/SkillAtlas.Web -c Release --no-build -o artifacts/web
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
      - name: Upload runnable packages
        uses: actions/upload-artifact@v4
        with:
          name: skill-atlas-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/web/
